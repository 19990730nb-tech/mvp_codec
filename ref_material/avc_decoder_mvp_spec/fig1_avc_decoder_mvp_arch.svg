<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <title>AVC Decoder MVP Overall Architecture</title>
  <rect x="0" y="0" width="1600" height="1040" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#263238"/>
    </marker>
    <marker id="arrowDash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#607d8b"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, 'Microsoft YaHei', sans-serif; fill:#111; }
      .boxTitle { font: 700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#111; }
      .txt { font: 13px Arial, 'Microsoft YaHei', sans-serif; fill:#222; }
      .small { font: 12px Arial, 'Microsoft YaHei', sans-serif; fill:#333; }
      .tiny { font: 11px Arial, 'Microsoft YaHei', sans-serif; fill:#444; }
      .reuse { fill:#eef3f5; stroke:#37474f; stroke-width:1.5; rx:8; }
      .new { fill:#f7f7f7; stroke:#111; stroke-width:2; rx:8; }
      .ext { fill:#fff; stroke:#607d8b; stroke-width:1.5; rx:8; }
      .bypass { fill:#fafafa; stroke:#9e9e9e; stroke-width:1.2; stroke-dasharray:6 5; rx:8; }
      .lane { fill:#ffffff; stroke:#90a4ae; stroke-width:1; rx:6; }
      .arrow { fill:none; stroke:#263238; stroke-width:1.8; marker-end:url(#arrow); }
      .arrow2 { fill:none; stroke:#263238; stroke-width:1.4; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#607d8b; stroke-width:1.4; stroke-dasharray:6 5; marker-end:url(#arrowDash); }
      .feedback { fill:none; stroke:#455a64; stroke-width:1.6; marker-end:url(#arrow); }
    </style>
  </defs>
<text x="800" y="38" class="title" text-anchor="middle">AVC Decoder MVP — Proposed Architecture / Data Flow</text><text x="800" y="62" class="tiny" text-anchor="middle">solid = decoder active path; dashed = encoder-only / dormant in AVC decode</text><rect x="40" y="110" width="260" height="160" class="ext"/><text x="170" y="140" class="boxTitle" text-anchor="middle"><tspan x="170" dy="0">CCU / Parser / NMU</tspan><tspan x="170" dy="20">decoded syntax + context</tspan></text><text x="170" y="190" class="small" text-anchor="middle"><tspan x="170" dy="0">mode / cux,cuy / sub_idx</tspan><tspan x="170" dy="18">ref_idx_l0 / MVD / skip</tspan><tspan x="170" dy="18">A/B availability</tspan></text><rect x="40" y="720" width="260" height="150" class="ext"/><text x="170" y="750" class="boxTitle" text-anchor="middle"><tspan x="170" dy="0">MVB SRAM</tspan><tspan x="170" dy="20">spatial motion neighbor</tspan></text><text x="170" y="802" class="small" text-anchor="middle"><tspan x="170" dy="0">A/B read data</tspan><tspan x="170" dy="18">gnt / rd_lat</tspan></text><rect x="1260" y="120" width="285" height="170" class="ext"/><text x="1402" y="150" class="boxTitle" text-anchor="middle"><tspan x="1402" dy="0">CCU Decoder Inter Path</tspan></text><text x="1402" y="195" class="small" text-anchor="middle"><tspan x="1402" dy="0">consume final MV/ref_idx</tspan><tspan x="1402" dy="18">issue MC command</tspan><tspan x="1402" dy="18">generate cur_cu_upd</tspan></text><rect x="1260" y="390" width="285" height="120" class="ext"/><text x="1402" y="420" class="boxTitle" text-anchor="middle"><tspan x="1402" dy="0">MC Subsystem</tspan></text><text x="1402" y="462" class="small" text-anchor="middle"><tspan x="1402" dy="0">motion compensation</tspan><tspan x="1402" dy="18">decoder prediction</tspan></text><rect x="1260" y="720" width="285" height="155" class="ext"/><text x="1402" y="750" class="boxTitle" text-anchor="middle"><tspan x="1402" dy="0">NMU / Writeback</tspan></text><text x="1402" y="800" class="small" text-anchor="middle"><tspan x="1402" dy="0">same-CTU buffer update</tspan><tspan x="1402" dy="18">row buffer → DMA → MVB</tspan></text><rect x="360" y="105" width="255" height="175" class="new"/><text x="488" y="136" class="boxTitle" text-anchor="middle"><tspan x="488" dy="0">DEC_CTRL  [NEW]</tspan></text><text x="488" y="181" class="small" text-anchor="middle"><tspan x="488" dy="0">input rendezvous</tspan><tspan x="488" dy="18">P16 / P8 S0→S3 scheduler</tspan><tspan x="488" dy="18">17-bit command context</tspan><tspan x="488" dy="18">no ref traversal</tspan></text><rect x="350" y="355" width="420" height="340" class="reuse"/><text x="560" y="382" class="boxTitle" text-anchor="middle"><tspan x="560" dy="0">vc_mvp_get_neib  [REUSE]</tspan></text><rect x="380" y="420" width="165" height="86" class="lane"/><text x="462" y="445" class="small" text-anchor="middle"><tspan x="462" dy="0">vc_mvp_rd_mem A</tspan></text><text x="462" y="480" class="tiny" text-anchor="middle"><tspan x="462" dy="0">req/gnt/rd_lat</tspan></text><rect x="575" y="420" width="165" height="86" class="lane"/><text x="657" y="445" class="small" text-anchor="middle"><tspan x="657" dy="0">vc_mvp_rd_mem B</tspan></text><text x="657" y="480" class="tiny" text-anchor="middle"><tspan x="657" dy="0">req/gnt/rd_lat</tspan></text><rect x="380" y="535" width="360" height="132" class="lane"/><text x="560" y="558" class="small" text-anchor="middle"><tspan x="560" dy="0">Neighbor View</tspan></text><text x="560" y="590" class="tiny" text-anchor="middle"><tspan x="560" dy="0">mvp_neib_a/b_reg  snapshot</tspan><tspan x="560" dy="17">a_0_reg / b_0_reg rolling</tspan><tspan x="560" dy="17">buf_reg corner assist</tspan></text><rect x="835" y="350" width="300" height="230" class="reuse"/><text x="985" y="380" class="boxTitle" text-anchor="middle"><tspan x="985" dy="0">vc_mvp_cand_gen  [REUSE MED]</tspan></text><text x="985" y="426" class="small" text-anchor="middle"><tspan x="985" dy="0">A = neib_a[1]</tspan><tspan x="985" dy="18">B = neib_b[1]</tspan><tspan x="985" dy="18">C = neib_b[0] / b2 fallback</tspan><tspan x="985" dy="18">component-wise signed median</tspan></text><text x="985" y="548" class="small" text-anchor="middle">MVP = cand_mv[0][31:0]</text><rect x="835" y="610" width="300" height="190" class="new"/><text x="985" y="642" class="boxTitle" text-anchor="middle"><tspan x="985" dy="0">DEC_RECON  [NEW]</tspan></text><text x="985" y="685" class="small" text-anchor="middle"><tspan x="985" dy="0">Inter: final MV = MVP + MVD</tspan><tspan x="985" dy="19">P_SKIP: zero-special ? 0 : MVP</tspan><tspan x="985" dy="19">carry parsed ref_idx_l0</tspan></text><text x="985" y="770" class="tiny" text-anchor="middle">result held until downstream accept</text><rect x="835" y="845" width="300" height="110" class="bypass"/><text x="985" y="875" class="small" text-anchor="middle"><tspan x="985" dy="0">Dormant / bypass in AVC decode</tspan></text><text x="985" y="910" class="tiny" text-anchor="middle"><tspan x="985" dy="0">vc_mvp_cand_prior / vc_mvp_scale</tspan><tspan x="985" dy="16">Colocated read / FME / ve_mrg_top cost path</tspan></text><path d="M300,190 L360,190" class="arrow"/><text x="330" y="178" class="tiny" text-anchor="middle">valid/ready</text><path d="M488,280 L488,330 L560,330 L560,355" class="arrow"/><text x="520" y="320" class="tiny" text-anchor="middle">neib_start + cmd</text><path d="M615,215 L785,215 L785,405 L835,405" class="arrow"/><text x="720" y="203" class="tiny" text-anchor="middle">cand_start + command</text><path d="M770,500 L835,500" class="arrow"/><text x="800" y="487" class="tiny" text-anchor="middle">A/B neighbor</text><path d="M985,580 L985,610" class="arrow"/><text x="1012" y="600" class="tiny" text-anchor="start">MVP</text><path d="M615,250 L770,250 L770,700 L835,700" class="arrow"/><text x="730" y="238" class="tiny" text-anchor="middle">MVD / ref_idx / skip</text><path d="M1135,700 L1260,205" class="arrow"/><text x="1194" y="446" class="tiny" text-anchor="middle">final MV + ref_idx</text><path d="M1402,290 L1402,390" class="arrow"/><text x="1430" y="344" class="tiny" text-anchor="start">MC cmd</text><path d="M1260,245 L1200,245 L1200,675 L770,675" class="feedback"/><text x="1085" y="662" class="tiny" text-anchor="middle">cur_cu_upd(final MV)</text><path d="M1402,290 L1402,720" class="feedback"/><text x="1435" y="620" class="tiny" text-anchor="start">cur_cu_upd</text><path d="M300,795 L325,795 L325,475 L350,475" class="arrow"/><text x="328" y="665" class="tiny" text-anchor="start">A/B read</text><path d="M1260,810 L1170,810 L1170,930 L170,930 L170,870" class="feedback"/><text x="700" y="920" class="tiny" text-anchor="middle">row-end DMA writeback</text><rect x="350" y="735" width="420" height="130" class="ext"/><text x="560" y="760" class="small" text-anchor="middle"><tspan x="560" dy="0">P8 intra-CU dependency</tspan></text><text x="560" y="795" class="tiny" text-anchor="middle"><tspan x="560" dy="0">S0 commit → S1/S2</tspan><tspan x="560" dy="17">S1 commit → S2/S3</tspan><tspan x="560" dy="17">S2 commit → S3</tspan></text><path d="M770,800 L800,800 L800,620 L770,620" class="feedback"/><text x="805" y="760" class="tiny" text-anchor="start">rolling MV</text><rect x="40" y="915" width="260" height="90" class="bypass"/><text x="170" y="942" class="small" text-anchor="middle"><tspan x="170" dy="0">Decoder principle</tspan></text><text x="170" y="975" class="tiny" text-anchor="middle"><tspan x="170" dy="0">reuse spatial neighbor + MED</tspan><tspan x="170" dy="16">remove encoder search / RDO</tspan></text></svg>