<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="860" viewBox="0 0 1750 860">
  <title>AVC Decoder MVP Hierarchy and Ownership</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/>
    </marker>
    <marker id="feedbackArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111; }
      .subtitle { font: 14px Arial, sans-serif; fill: #455a64; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #111; }
      .body { font: 14px Arial, sans-serif; fill: #222; }
      .small { font: 12px Arial, sans-serif; fill: #37474f; }
      .tiny { font: 11px Arial, sans-serif; fill: #455a64; }
      .external { fill: #fff; stroke: #607d8b; stroke-width: 1.5; rx: 10; }
      .decoder { fill: #f5f7f8; stroke: #263238; stroke-width: 2; rx: 10; }
      .reuse { fill: #e8f1f5; stroke: #1565c0; stroke-width: 1.8; rx: 10; }
      .control { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 1.8; rx: 10; }
      .flush { fill: #fff8e1; stroke: #ef6c00; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 10; }
      .disabled { fill: #fafafa; stroke: #9e9e9e; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 10; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #1565c0; stroke-width: 1.8; marker-end: url(#feedbackArrow); }
    </style>
  </defs>
  <text x="875" y="36" class="title" text-anchor="middle">AVC Decoder MVP Hierarchy and Ownership</text>
  <text x="875" y="64" class="subtitle" text-anchor="middle">The Decoder owns admission through MC retirement; reused Neighbor and Candidate logic remain explicit</text>
<rect x="70" y="125" width="280" height="170" class="control"/><text x="210.0" y="155" class="box-title" text-anchor="middle">vc_mvp_dec_top</text><text x="210.0" y="177" class="body" text-anchor="middle">top-level Decoder</text><text x="210.0" y="199" class="body" text-anchor="middle">backend and Candidate</text><rect x="430" y="110" width="300" height="200" class="decoder"/><text x="580.0" y="140" class="box-title" text-anchor="middle">vc_mvp_dec_backend_top</text><text x="580.0" y="162" class="body" text-anchor="middle">Neighbor top</text><text x="580.0" y="184" class="body" text-anchor="middle">reconstruction</text><text x="580.0" y="206" class="body" text-anchor="middle">MC adapter</text><text x="580.0" y="228" class="body" text-anchor="middle">update adapter</text><rect x="810" y="110" width="300" height="200" class="reuse"/><text x="960.0" y="140" class="box-title" text-anchor="middle">vc_mvp_dec_neib_top</text><text x="960.0" y="162" class="body" text-anchor="middle">vc_mvp_dec_ctrl</text><text x="960.0" y="184" class="body" text-anchor="middle">neib_adapter</text><text x="960.0" y="206" class="body" text-anchor="middle">real vc_mvp_get_neib</text><text x="960.0" y="228" class="body" text-anchor="middle">dec_upd_adapter</text><rect x="1190" y="110" width="250" height="200" class="reuse"/><text x="1315.0" y="140" class="box-title" text-anchor="middle">vc_mvp_dec_cand</text><text x="1315.0" y="162" class="body" text-anchor="middle">real vc_mvp_cand_gen</text><text x="1315.0" y="184" class="body" text-anchor="middle">AVC MED</text><text x="1315.0" y="206" class="body" text-anchor="middle">candidate0</text><path d="M350,210 L430,210" class="arrow"/><path d="M730,210 L810,210" class="arrow"/><path d="M210,295 L210,345 L1315,345 L1315,310" class="arrow"/><rect x="85" y="420" width="260" height="145" class="external"/><text x="215.0" y="450" class="box-title" text-anchor="middle">accepted syntax</text><text x="215.0" y="472" class="body" text-anchor="middle">latched transaction</text><text x="215.0" y="494" class="body" text-anchor="middle">MVD / ref_idx / mode</text><rect x="430" y="405" width="250" height="175" class="reuse"/><text x="555.0" y="435" class="box-title" text-anchor="middle">DEC_NEIB</text><text x="555.0" y="457" class="body" text-anchor="middle">A/B read and snapshot</text><text x="555.0" y="479" class="body" text-anchor="middle">qualified Neighbor done</text><rect x="765" y="405" width="250" height="175" class="reuse"/><text x="890.0" y="435" class="box-title" text-anchor="middle">Candidate capture</text><text x="890.0" y="457" class="body" text-anchor="middle">spatial MVP</text><text x="890.0" y="479" class="body" text-anchor="middle">cand_capture_done</text><rect x="1100" y="405" width="250" height="175" class="decoder"/><text x="1225.0" y="435" class="box-title" text-anchor="middle">reconstruction</text><text x="1225.0" y="457" class="body" text-anchor="middle">final MV</text><text x="1225.0" y="479" class="body" text-anchor="middle">dec_recon_start / done</text><rect x="1430" y="405" width="250" height="175" class="decoder"/><text x="1555.0" y="435" class="box-title" text-anchor="middle">DEC_SEND</text><text x="1555.0" y="457" class="body" text-anchor="middle">mrg2mc packet</text><text x="1555.0" y="479" class="body" text-anchor="middle">MC acknowledgement</text><path d="M345,492 L430,492" class="arrow"/><path d="M680,492 L765,492" class="arrow"/><path d="M1015,492 L1100,492" class="arrow"/><path d="M1350,492 L1430,492" class="arrow"/><rect x="465" y="665" width="570" height="105" class="reuse"/><text x="750.0" y="695" class="box-title" text-anchor="middle">mc_commit</text><text x="750.0" y="717" class="body" text-anchor="middle">cur_cu_upd</text><text x="750.0" y="739" class="body" text-anchor="middle">rolling a_0_reg / b_0_reg / buf_reg</text><path d="M1555,580 L1555,630 L1035,630 L1035,665" class="feedback"/><path d="M465,715 L360,715 L360,565 L430,565" class="feedback"/><text x="1290" y="615" class="small" text-anchor="middle">rdy &amp; ack -&gt; mc_commit</text><rect x="1080" y="665" width="310" height="105" class="flush"/><text x="1235.0" y="695" class="box-title" text-anchor="middle">flush</text><text x="1235.0" y="717" class="body" text-anchor="middle">cancel downstream pulses</text><text x="1235.0" y="739" class="body" text-anchor="middle">drain A/B responses</text></svg>