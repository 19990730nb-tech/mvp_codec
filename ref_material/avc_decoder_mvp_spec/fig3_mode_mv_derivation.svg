<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="980" viewBox="0 0 1750 980">
  <title>AVC Candidate, P_SKIP, Reconstruction, and MC Mapping</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/>
    </marker>
    <marker id="feedbackArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111; }
      .subtitle { font: 14px Arial, sans-serif; fill: #455a64; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #111; }
      .body { font: 14px Arial, sans-serif; fill: #222; }
      .small { font: 12px Arial, sans-serif; fill: #37474f; }
      .tiny { font: 11px Arial, sans-serif; fill: #455a64; }
      .external { fill: #fff; stroke: #607d8b; stroke-width: 1.5; rx: 10; }
      .decoder { fill: #f5f7f8; stroke: #263238; stroke-width: 2; rx: 10; }
      .reuse { fill: #e8f1f5; stroke: #1565c0; stroke-width: 1.8; rx: 10; }
      .control { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 1.8; rx: 10; }
      .flush { fill: #fff8e1; stroke: #ef6c00; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 10; }
      .disabled { fill: #fafafa; stroke: #9e9e9e; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 10; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #1565c0; stroke-width: 1.8; marker-end: url(#feedbackArrow); }
    </style>
  </defs>
  <text x="875" y="36" class="title" text-anchor="middle">AVC Candidate, P_SKIP, Reconstruction, and MC Mapping</text>
  <text x="875" y="64" class="subtitle" text-anchor="middle">Phase-1 AVC uses candidate0, signed component arithmetic, and the reused mrg2mc packet interface</text>
<rect x="45" y="350" width="300" height="200" class="reuse"/><text x="195.0" y="380" class="box-title" text-anchor="middle">Neighbor candidates</text><text x="195.0" y="402" class="body" text-anchor="middle">A = A1</text><text x="195.0" y="424" class="body" text-anchor="middle">B = B1</text><text x="195.0" y="446" class="body" text-anchor="middle">C = B0 then B2</text><text x="195.0" y="468" class="body" text-anchor="middle">A0 masked</text><rect x="430" y="105" width="360" height="220" class="decoder"/><text x="610.0" y="135" class="box-title" text-anchor="middle">Normal Inter</text><text x="610.0" y="157" class="body" text-anchor="middle">MVP X/Y + MVD X/Y</text><text x="610.0" y="179" class="body" text-anchor="middle">explicit signed 17-bit</text><text x="610.0" y="201" class="body" text-anchor="middle">low 16 bits retained</text><text x="610.0" y="223" class="body" text-anchor="middle">final MV</text><rect x="430" y="575" width="360" height="235" class="decoder"/><text x="610.0" y="605" class="box-title" text-anchor="middle">P_SKIP</text><text x="610.0" y="627" class="body" text-anchor="middle">top16 or left16</text><text x="610.0" y="649" class="body" text-anchor="middle">or available A1/B1 is zero</text><text x="610.0" y="671" class="body" text-anchor="middle">true -&gt; final MV zero</text><text x="610.0" y="693" class="body" text-anchor="middle">false -&gt; spatial MVP</text><text x="610.0" y="715" class="body" text-anchor="middle">MVD ignored; ref_idx 0</text><path d="M345,430 L430,215" class="arrow"/><path d="M345,470 L380,470 L380,690 L430,690" class="arrow"/><rect x="870" y="310" width="300" height="190" class="decoder"/><text x="1020.0" y="340" class="box-title" text-anchor="middle">final MV / ref_idx</text><text x="1020.0" y="362" class="body" text-anchor="middle">normal: low-16 result</text><text x="1020.0" y="384" class="body" text-anchor="middle">skip: zero or spatial MVP</text><text x="1020.0" y="406" class="body" text-anchor="middle">common result boundary</text><path d="M790,215 L830,215 L830,365 L870,365" class="arrow"/><path d="M790,690 L830,690 L830,445 L870,445" class="arrow"/><rect x="1230" y="310" width="300" height="190" class="decoder"/><text x="1380.0" y="340" class="box-title" text-anchor="middle">common MC adapter</text><text x="1380.0" y="362" class="body" text-anchor="middle">P8 -&gt; lane 0</text><text x="1380.0" y="384" class="body" text-anchor="middle">P16/P_SKIP -&gt; lane 1</text><text x="1380.0" y="406" class="body" text-anchor="middle">lane 2 unused</text><text x="1380.0" y="428" class="body" text-anchor="middle">packet held while mc2mrg_cand_ack is low</text><path d="M1170,405 L1230,405" class="arrow"/><rect x="1580" y="310" width="145" height="190" class="reuse"/><text x="1652.5" y="340" class="box-title" text-anchor="middle">retirement</text><text x="1652.5" y="362" class="body" text-anchor="middle">ack</text><text x="1652.5" y="384" class="body" text-anchor="middle">mc_commit</text><text x="1652.5" y="406" class="body" text-anchor="middle">done/update</text><path d="M1530,405 L1580,405" class="arrow"/><rect x="80" y="875" width="1645" height="70" class="disabled"/><text x="902.5" y="905" class="box-title" text-anchor="middle">Phase-1 tie-offs: NUM_REF=1, Candidate-side cur_ref_idx=0, sanitized Neighbor ref fields, temporal/Col and scaling inactive, RefList traversal inactive</text></svg>