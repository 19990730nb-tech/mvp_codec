<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <title>AVC Decoder Motion Vector Derivation</title>
  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#263238"/>
    </marker>
    <marker id="arrowDash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#607d8b"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, 'Microsoft YaHei', sans-serif; fill:#111; }
      .boxTitle { font: 700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#111; }
      .txt { font: 13px Arial, 'Microsoft YaHei', sans-serif; fill:#222; }
      .small { font: 12px Arial, 'Microsoft YaHei', sans-serif; fill:#333; }
      .tiny { font: 11px Arial, 'Microsoft YaHei', sans-serif; fill:#444; }
      .reuse { fill:#eef3f5; stroke:#37474f; stroke-width:1.5; rx:8; }
      .new { fill:#f7f7f7; stroke:#111; stroke-width:2; rx:8; }
      .ext { fill:#fff; stroke:#607d8b; stroke-width:1.5; rx:8; }
      .bypass { fill:#fafafa; stroke:#9e9e9e; stroke-width:1.2; stroke-dasharray:6 5; rx:8; }
      .lane { fill:#ffffff; stroke:#90a4ae; stroke-width:1; rx:6; }
      .arrow { fill:none; stroke:#263238; stroke-width:1.8; marker-end:url(#arrow); }
      .arrow2 { fill:none; stroke:#263238; stroke-width:1.4; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#607d8b; stroke-width:1.4; stroke-dasharray:6 5; marker-end:url(#arrowDash); }
      .feedback { fill:none; stroke:#455a64; stroke-width:1.6; marker-end:url(#arrow); }
    </style>
  </defs>
<text x="700" y="38" class="title" text-anchor="middle">AVC Decoder — P16/P8 vs P_SKIP MV Derivation</text><rect x="50" y="110" width="240" height="110" class="ext"/><text x="170" y="140" class="boxTitle" text-anchor="middle"><tspan x="170" dy="0">A/B spatial neighbors</tspan></text><text x="170" y="180" class="small" text-anchor="middle"><tspan x="170" dy="0">snapshot + rolling regs</tspan></text><rect x="380" y="105" width="280" height="180" class="reuse"/><text x="520" y="136" class="boxTitle" text-anchor="middle"><tspan x="520" dy="0">AVC MED predictor</tspan></text><text x="520" y="178" class="small" text-anchor="middle"><tspan x="520" dy="0">A = a1</tspan><tspan x="520" dy="18">B = b1</tspan><tspan x="520" dy="18">C = b0 / b2 fallback</tspan></text><text x="520" y="250" class="boxTitle" text-anchor="middle">MVP</text><path d="M290,165 L380,165" class="arrow"/><rect x="760" y="90" width="260" height="230" class="new"/><text x="890" y="122" class="boxTitle" text-anchor="middle"><tspan x="890" dy="0">P16 / P8 Inter</tspan></text><text x="890" y="165" class="small" text-anchor="middle"><tspan x="890" dy="0">decoded MVD</tspan><tspan x="890" dy="18">signed add</tspan></text><text x="890" y="220" class="boxTitle" text-anchor="middle">final MV = MVP + MVD</text><text x="890" y="270" class="small" text-anchor="middle">ref_idx_l0 carried separately</text><path d="M660,190 L760,190" class="arrow"/><rect x="760" y="405" width="260" height="230" class="new"/><text x="890" y="438" class="boxTitle" text-anchor="middle"><tspan x="890" dy="0">P_SKIP</tspan></text><text x="890" y="480" class="small" text-anchor="middle"><tspan x="890" dy="0">zero-motion special rule</tspan><tspan x="890" dy="18">else use MED MVP</tspan></text><text x="890" y="535" class="boxTitle" text-anchor="middle">final MV = 0 or MVP</text><text x="890" y="585" class="small" text-anchor="middle">no decoded MVD</text><path d="M660,225 L700,225 L700,520 L760,520" class="arrow"/><rect x="1120" y="250" width="230" height="210" class="ext"/><text x="1235" y="282" class="boxTitle" text-anchor="middle"><tspan x="1235" dy="0">Decoder result</tspan></text><text x="1235" y="326" class="small" text-anchor="middle"><tspan x="1235" dy="0">final MV</tspan><tspan x="1235" dy="18">ref_idx_l0</tspan><tspan x="1235" dy="18">position / size</tspan></text><text x="1235" y="410" class="boxTitle" text-anchor="middle">→ CCU → MC</text><path d="M1020,220 L1120,305" class="arrow"/><path d="M1020,535 L1120,405" class="arrow"/><rect x="50" y="500" width="610" height="135" class="bypass"/><text x="355" y="530" class="small" text-anchor="middle"><tspan x="355" dy="0">Not used in decoder MV derivation</tspan></text><text x="355" y="568" class="tiny" text-anchor="middle"><tspan x="355" dy="0">IME/FME search · FME SATD · reference traversal · vc_mvp_scale · ve_mrg_top cost/RDO</tspan></text></svg>