<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <title>AVC Candidate, P_SKIP, Reconstruction, and MC Mapping</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/>
    </marker>
    <marker id="feedbackArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111; }
      .subtitle { font: 14px Arial, sans-serif; fill: #455a64; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #111; }
      .body { font: 14px Arial, sans-serif; fill: #222; }
      .small { font: 12px Arial, sans-serif; fill: #37474f; }
      .tiny { font: 11px Arial, sans-serif; fill: #455a64; }
      .external { fill: #fff; stroke: #607d8b; stroke-width: 1.5; rx: 10; }
      .decoder { fill: #f5f7f8; stroke: #263238; stroke-width: 2; rx: 10; }
      .reuse { fill: #e8f1f5; stroke: #1565c0; stroke-width: 1.8; rx: 10; }
      .control { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 1.8; rx: 10; }
      .flush { fill: #fff8e1; stroke: #ef6c00; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 10; }
      .disabled { fill: #fafafa; stroke: #9e9e9e; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 10; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #1565c0; stroke-width: 1.8; marker-end: url(#feedbackArrow); }
    </style>
  </defs>
  <text x="800" y="36" class="title" text-anchor="middle">AVC Candidate, P_SKIP, Reconstruction, and MC Mapping</text>
  <text x="800" y="64" class="subtitle" text-anchor="middle">Phase-1 AVC uses candidate0, signed component arithmetic, and the reused mrg2mc packet interface</text>
<rect x="45" y="135" width="300" height="200" class="reuse"/><text x="195.0" y="165" class="box-title" text-anchor="middle">Neighbor candidates</text><text x="195.0" y="187" class="body" text-anchor="middle">A = A1</text><text x="195.0" y="209" class="body" text-anchor="middle">B = B1</text><text x="195.0" y="231" class="body" text-anchor="middle">C = B0 then B2</text><text x="195.0" y="253" class="body" text-anchor="middle">A0 masked</text><rect x="460" y="105" width="350" height="255" class="reuse"/><text x="635.0" y="135" class="box-title" text-anchor="middle">AVC candidate0</text><text x="635.0" y="157" class="body" text-anchor="middle">none -&gt; zero</text><text x="635.0" y="179" class="body" text-anchor="middle">one operand -&gt; that operand</text><text x="635.0" y="201" class="body" text-anchor="middle">otherwise signed MED</text><text x="635.0" y="223" class="body" text-anchor="middle">candidate1 disabled</text><path d="M345,235 L460,235" class="arrow"/><rect x="930" y="105" width="300" height="255" class="decoder"/><text x="1080.0" y="135" class="box-title" text-anchor="middle">Normal Inter</text><text x="1080.0" y="157" class="body" text-anchor="middle">MVP X/Y + MVD X/Y</text><text x="1080.0" y="179" class="body" text-anchor="middle">explicit signed 17-bit</text><text x="1080.0" y="201" class="body" text-anchor="middle">low 16 bits retained</text><text x="1080.0" y="223" class="body" text-anchor="middle">final MV = {Y, X}</text><path d="M810,235 L930,235" class="arrow"/><rect x="1270" y="105" width="285" height="255" class="decoder"/><text x="1412.5" y="135" class="box-title" text-anchor="middle">P16 / P8 MC</text><text x="1412.5" y="157" class="body" text-anchor="middle">P16 lane 1</text><text x="1412.5" y="179" class="body" text-anchor="middle">P8 lane 0</text><text x="1412.5" y="201" class="body" text-anchor="middle">P_SKIP lane 1</text><text x="1412.5" y="223" class="body" text-anchor="middle">lane 2 unused</text><path d="M1230,235 L1270,235" class="arrow"/><rect x="460" y="470" width="350" height="255" class="decoder"/><text x="635.0" y="500" class="box-title" text-anchor="middle">P_SKIP</text><text x="635.0" y="522" class="body" text-anchor="middle">top16 or left16</text><text x="635.0" y="544" class="body" text-anchor="middle">or available A1/B1 is zero</text><text x="635.0" y="566" class="body" text-anchor="middle">true -&gt; final MV zero</text><text x="635.0" y="588" class="body" text-anchor="middle">false -&gt; spatial MVP</text><text x="635.0" y="610" class="body" text-anchor="middle">MVD ignored; ref_idx 0</text><path d="M610,360 L610,470" class="arrow"/><rect x="930" y="470" width="300" height="255" class="decoder"/><text x="1080.0" y="500" class="box-title" text-anchor="middle">Packet</text><text x="1080.0" y="522" class="body" text-anchor="middle">valid + picture coordinates</text><text x="1080.0" y="544" class="body" text-anchor="middle">two size fields</text><text x="1080.0" y="566" class="body" text-anchor="middle">ref_idx + final MV</text><text x="1080.0" y="588" class="body" text-anchor="middle">stable while backpressured</text><path d="M810,600 L930,600" class="arrow"/><rect x="1270" y="470" width="285" height="255" class="reuse"/><text x="1412.5" y="500" class="box-title" text-anchor="middle">Retirement</text><text x="1412.5" y="522" class="body" text-anchor="middle">MC acknowledgement</text><text x="1412.5" y="544" class="body" text-anchor="middle">mc_commit</text><text x="1412.5" y="566" class="body" text-anchor="middle">registered done pulse</text><text x="1412.5" y="588" class="body" text-anchor="middle">cur_cu_upd</text><path d="M1230,600 L1270,600" class="arrow"/><rect x="80" y="820" width="1475" height="70" class="disabled"/><text x="817.5" y="850" class="box-title" text-anchor="middle">Phase-1 tie-offs: NUM_REF=1, Candidate-side cur_ref_idx=0, sanitized Neighbor ref fields, temporal/Col and scaling inactive, RefList traversal inactive</text></svg>