<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880">
  <title>AVC Decoder P8x8 Transaction and Neighbor Dependency</title>
  <rect x="0" y="0" width="1500" height="880" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#263238"/>
    </marker>
    <marker id="arrowDash" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#607d8b"/>
    </marker>
    <style>
      .title { font: 700 22px Arial, 'Microsoft YaHei', sans-serif; fill:#111; }
      .boxTitle { font: 700 15px Arial, 'Microsoft YaHei', sans-serif; fill:#111; }
      .txt { font: 13px Arial, 'Microsoft YaHei', sans-serif; fill:#222; }
      .small { font: 12px Arial, 'Microsoft YaHei', sans-serif; fill:#333; }
      .tiny { font: 11px Arial, 'Microsoft YaHei', sans-serif; fill:#444; }
      .reuse { fill:#eef3f5; stroke:#37474f; stroke-width:1.5; rx:8; }
      .new { fill:#f7f7f7; stroke:#111; stroke-width:2; rx:8; }
      .ext { fill:#fff; stroke:#607d8b; stroke-width:1.5; rx:8; }
      .bypass { fill:#fafafa; stroke:#9e9e9e; stroke-width:1.2; stroke-dasharray:6 5; rx:8; }
      .lane { fill:#ffffff; stroke:#90a4ae; stroke-width:1; rx:6; }
      .arrow { fill:none; stroke:#263238; stroke-width:1.8; marker-end:url(#arrow); }
      .arrow2 { fill:none; stroke:#263238; stroke-width:1.4; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#607d8b; stroke-width:1.4; stroke-dasharray:6 5; marker-end:url(#arrowDash); }
      .feedback { fill:none; stroke:#455a64; stroke-width:1.6; marker-end:url(#arrow); }
    </style>
  </defs>
<text x="750" y="38" class="title" text-anchor="middle">AVC P8×8 — Serial Transaction / Neighbor Dependency</text><text x="750" y="62" class="tiny" text-anchor="middle">AVC test condition: reg_tmp_mvp_flag = 0 → no colocated SRAM read</text><rect x="50" y="100" width="250" height="105" class="ext"/><text x="175" y="130" class="boxTitle" text-anchor="middle"><tspan x="175" dy="0">MVB SRAM → snapshot</tspan></text><text x="175" y="165" class="small" text-anchor="middle"><tspan x="175" dy="0">mvp_neib_a_reg</tspan><tspan x="175" dy="16">mvp_neib_b_reg</tspan></text><rect x="1200" y="100" width="250" height="105" class="ext"/><text x="1325" y="130" class="boxTitle" text-anchor="middle"><tspan x="1325" dy="0">CCU final MV commit</tspan></text><text x="1325" y="165" class="small" text-anchor="middle"><tspan x="1325" dy="0">cur_cu_upd pulse</tspan></text><rect x="80" y="300" width="280" height="300" class="new"/><text x="220" y="332" class="boxTitle" text-anchor="middle">S0 / 8_0</text><text x="220" y="370" class="small" text-anchor="middle">A×2 + B×2 = 4</text><text x="108" y="415" class="small" text-anchor="start">A: snapshot</text><text x="108" y="443" class="small" text-anchor="start">B/C/B2: snapshot</text><text x="220" y="545" class="small" text-anchor="middle">MED → MVP → +MVD</text><text x="220" y="575" class="boxTitle" text-anchor="middle">final MV</text><rect x="430" y="300" width="280" height="300" class="new"/><text x="570" y="332" class="boxTitle" text-anchor="middle">S1 / 8_1</text><text x="570" y="370" class="small" text-anchor="middle">B×2 = 2</text><text x="458" y="415" class="small" text-anchor="start">A: a_0_reg(S0)</text><text x="458" y="443" class="small" text-anchor="start">B/C/B2: snapshot</text><text x="570" y="545" class="small" text-anchor="middle">MED → MVP → +MVD</text><text x="570" y="575" class="boxTitle" text-anchor="middle">final MV</text><rect x="780" y="300" width="280" height="300" class="new"/><text x="920" y="332" class="boxTitle" text-anchor="middle">S2 / 8_2</text><text x="920" y="370" class="small" text-anchor="middle">A×2 = 2</text><text x="808" y="415" class="small" text-anchor="start">A: snapshot</text><text x="808" y="443" class="small" text-anchor="start">B: b_0_reg(S0)</text><text x="808" y="471" class="small" text-anchor="start">C: b_0_reg(S1)</text><text x="808" y="499" class="small" text-anchor="start">B2: buf/rolling case</text><text x="920" y="545" class="small" text-anchor="middle">MED → MVP → +MVD</text><text x="920" y="575" class="boxTitle" text-anchor="middle">final MV</text><rect x="1130" y="300" width="280" height="300" class="new"/><text x="1270" y="332" class="boxTitle" text-anchor="middle">S3 / 8_3</text><text x="1270" y="370" class="small" text-anchor="middle">SRAM read = 0</text><text x="1158" y="415" class="small" text-anchor="start">A: a_0_reg(S2)</text><text x="1158" y="443" class="small" text-anchor="start">B: b_0_reg(S1)</text><text x="1158" y="471" class="small" text-anchor="start">C/B2: rolling/boundary case</text><text x="1270" y="545" class="small" text-anchor="middle">MED → MVP → +MVD</text><text x="1270" y="575" class="boxTitle" text-anchor="middle">final MV</text><path d="M360,450 L430,450" class="arrow"/><text x="395.0" y="435" class="tiny" text-anchor="middle">next after commit</text><path d="M710,450 L780,450" class="arrow"/><text x="745.0" y="435" class="tiny" text-anchor="middle">next after commit</text><path d="M1060,450 L1130,450" class="arrow"/><text x="1095.0" y="435" class="tiny" text-anchor="middle">next after commit</text><path d="M175,205 L175,250 L220,250 L220,300" class="arrow2"/><path d="M175,205 L175,250 L570,250 L570,300" class="arrow2"/><path d="M175,205 L175,250 L920,250 L920,300" class="arrow2"/><rect x="390" y="680" width="720" height="115" class="reuse"/><text x="750" y="710" class="boxTitle" text-anchor="middle"><tspan x="750" dy="0">IRPU rolling neighbor registers</tspan></text><text x="750" y="748" class="small" text-anchor="middle"><tspan x="750" dy="0">a_0_reg / b_0_reg (+ buf_reg corner assist)</tspan></text><text x="750" y="778" class="tiny" text-anchor="middle">written by cur_cu_upd(final MV), no handshake</text><path d="M220,600 L220,650 L600,650 L600,680" class="feedback"/><path d="M570,600 L570,650 L730,650 L730,680" class="feedback"/><path d="M920,600 L920,650 L860,650 L860,680" class="feedback"/><path d="M650,680 L650,640 L570,640 L570,600" class="feedback"/><path d="M750,680 L750,630 L920,630 L920,600" class="feedback"/><path d="M850,680 L850,620 L1270,620 L1270,600" class="feedback"/><path d="M1325,205 L1325,265 L1450,265 L1450,740 L1110,740" class="feedback"/><text x="1378" y="253" class="tiny" text-anchor="middle">commit source</text><rect x="50" y="680" width="285" height="115" class="bypass"/><text x="192" y="710" class="small" text-anchor="middle"><tspan x="192" dy="0">Important</tspan></text><text x="192" y="745" class="tiny" text-anchor="middle"><tspan x="192" dy="0">S0→S1→S2→S3 serial</tspan><tspan x="192" dy="16">later blocks consume reconstructed final MV</tspan></text></svg>