<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>AVC P8x8 Serial Neighbor and Commit Flow</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/>
    </marker>
    <marker id="feedbackArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111; }
      .subtitle { font: 14px Arial, sans-serif; fill: #455a64; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #111; }
      .body { font: 14px Arial, sans-serif; fill: #222; }
      .small { font: 12px Arial, sans-serif; fill: #37474f; }
      .tiny { font: 11px Arial, sans-serif; fill: #455a64; }
      .external { fill: #fff; stroke: #607d8b; stroke-width: 1.5; rx: 10; }
      .decoder { fill: #f5f7f8; stroke: #263238; stroke-width: 2; rx: 10; }
      .reuse { fill: #e8f1f5; stroke: #1565c0; stroke-width: 1.8; rx: 10; }
      .control { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 1.8; rx: 10; }
      .flush { fill: #fff8e1; stroke: #ef6c00; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 10; }
      .disabled { fill: #fafafa; stroke: #9e9e9e; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 10; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #1565c0; stroke-width: 1.8; marker-end: url(#feedbackArrow); }
    </style>
  </defs>
  <text x="800" y="36" class="title" text-anchor="middle">AVC P8x8 Serial Neighbor and Commit Flow</text>
  <text x="800" y="64" class="subtitle" text-anchor="middle">Each later sub-block waits for the preceding MC commit and rolling-neighbor update</text>
<rect x="55" y="180" width="300" height="210" class="reuse"/><text x="205.0" y="210" class="box-title" text-anchor="middle">S0</text><text x="205.0" y="232" class="body" text-anchor="middle">Neighbor acquisition</text><text x="205.0" y="254" class="body" text-anchor="middle">A/B SRAM snapshot</text><text x="205.0" y="276" class="body" text-anchor="middle">C uses B0/B2</text><text x="205.0" y="298" class="body" text-anchor="middle">Candidate0 -&gt; recon</text><rect x="435" y="180" width="300" height="210" class="reuse"/><text x="585.0" y="210" class="box-title" text-anchor="middle">S1</text><text x="585.0" y="232" class="body" text-anchor="middle">Neighbor acquisition</text><text x="585.0" y="254" class="body" text-anchor="middle">A from a_0_reg</text><text x="585.0" y="276" class="body" text-anchor="middle">B/C Neighbor view</text><text x="585.0" y="298" class="body" text-anchor="middle">Candidate0 -&gt; recon</text><rect x="815" y="180" width="300" height="210" class="reuse"/><text x="965.0" y="210" class="box-title" text-anchor="middle">S2</text><text x="965.0" y="232" class="body" text-anchor="middle">Neighbor acquisition</text><text x="965.0" y="254" class="body" text-anchor="middle">A Neighbor view</text><text x="965.0" y="276" class="body" text-anchor="middle">B/C rolling state</text><text x="965.0" y="298" class="body" text-anchor="middle">Candidate0 -&gt; recon</text><rect x="1195" y="180" width="300" height="210" class="reuse"/><text x="1345.0" y="210" class="box-title" text-anchor="middle">S3</text><text x="1345.0" y="232" class="body" text-anchor="middle">Neighbor acquisition</text><text x="1345.0" y="254" class="body" text-anchor="middle">A/B/C rolling view</text><text x="1345.0" y="276" class="body" text-anchor="middle">boundary handling</text><text x="1345.0" y="298" class="body" text-anchor="middle">Candidate0 -&gt; recon</text><path d="M355,285 L435,285" class="arrow"/><text x="395.0" y="270" class="tiny" text-anchor="middle">after mc_commit</text><path d="M735,285 L815,285" class="arrow"/><text x="775.0" y="270" class="tiny" text-anchor="middle">after mc_commit</text><path d="M1115,285 L1195,285" class="arrow"/><text x="1155.0" y="270" class="tiny" text-anchor="middle">after mc_commit</text><rect x="125" y="500" width="1350" height="120" class="decoder"/><text x="800.0" y="530" class="box-title" text-anchor="middle">MC adapter</text><text x="800.0" y="552" class="body" text-anchor="middle">P8 lane 0, mask 3&#x27;b001, size code 1; rdy stays asserted while ack is low</text><text x="800.0" y="574" class="body" text-anchor="middle">mc_commit = |(rdy &amp; ack); dec_mrg2mc_cand_done is a registered one-cycle pulse</text><path d="M205,390 L205,470 L205,500" class="arrow"/><path d="M585,390 L585,470 L585,500" class="arrow"/><path d="M965,390 L965,470 L965,500" class="arrow"/><path d="M1345,390 L1345,470 L1345,500" class="arrow"/><rect x="280" y="700" width="1040" height="95" class="reuse"/><text x="800.0" y="730" class="box-title" text-anchor="middle">cur_cu_upd from mc_commit</text><text x="800.0" y="752" class="body" text-anchor="middle">rolling a_0_reg / b_0_reg / buf_reg become visible to the next required Neighbor lookup</text><path d="M800,620 L800,700" class="feedback"/><rect x="60" y="825" width="1480" height="50" class="flush"/><text x="800.0" y="855" class="box-title" text-anchor="middle">flush: cancel current transaction; A/B physical read counters remain until rd_lat drain; ready and qualified Neighbor done reopen only when quiescent</text></svg>