<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1040" viewBox="0 0 1900 1040">
  <title>AVC Decoder MVP Canonical Data Flow</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#263238"/>
    </marker>
    <marker id="feedbackArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111; }
      .subtitle { font: 14px Arial, sans-serif; fill: #455a64; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #111; }
      .body { font: 14px Arial, sans-serif; fill: #222; }
      .small { font: 12px Arial, sans-serif; fill: #37474f; }
      .tiny { font: 11px Arial, sans-serif; fill: #455a64; }
      .external { fill: #fff; stroke: #607d8b; stroke-width: 1.5; rx: 10; }
      .decoder { fill: #f5f7f8; stroke: #263238; stroke-width: 2; rx: 10; }
      .reuse { fill: #e8f1f5; stroke: #1565c0; stroke-width: 1.8; rx: 10; }
      .control { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 1.8; rx: 10; }
      .flush { fill: #fff8e1; stroke: #ef6c00; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 10; }
      .disabled { fill: #fafafa; stroke: #9e9e9e; stroke-width: 1.2; stroke-dasharray: 6 5; rx: 10; }
      .arrow { fill: none; stroke: #263238; stroke-width: 2; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #1565c0; stroke-width: 1.8; marker-end: url(#feedbackArrow); }
    </style>
  </defs>
  <text x="950" y="36" class="title" text-anchor="middle">AVC Decoder MVP Canonical Data Flow</text>
  <text x="950" y="64" class="subtitle" text-anchor="middle">Implemented ownership and transaction flow; blue arrows are commit or rolling-neighbor feedback</text>
<rect x="35" y="150" width="210" height="145" class="external"/><text x="140.0" y="180" class="box-title" text-anchor="middle">Decoded syntax</text><text x="140.0" y="202" class="body" text-anchor="middle">mode / coordinates</text><text x="140.0" y="224" class="body" text-anchor="middle">A/B availability</text><text x="140.0" y="246" class="body" text-anchor="middle">MVD / ref_idx / skip</text><rect x="285" y="150" width="220" height="145" class="control"/><text x="395.0" y="180" class="box-title" text-anchor="middle">vc_mvp_dec_ctrl</text><text x="395.0" y="202" class="body" text-anchor="middle">accept and latch</text><text x="395.0" y="224" class="body" text-anchor="middle">DEC_NEIB to DEC_SEND</text><text x="395.0" y="246" class="body" text-anchor="middle">P8 order tracking</text><rect x="545" y="150" width="255" height="180" class="reuse"/><text x="672.5" y="180" class="box-title" text-anchor="middle">vc_mvp_dec_neib_top</text><text x="672.5" y="202" class="body" text-anchor="middle">vc_mvp_dec_neib_adapter</text><text x="672.5" y="224" class="body" text-anchor="middle">real Neighbor hierarchy</text><text x="672.5" y="246" class="body" text-anchor="middle">A/B snapshot and drain</text><rect x="840" y="150" width="255" height="180" class="reuse"/><text x="967.5" y="180" class="box-title" text-anchor="middle">vc_mvp_dec_cand</text><text x="967.5" y="202" class="body" text-anchor="middle">real vc_mvp_cand_gen</text><text x="967.5" y="224" class="body" text-anchor="middle">A=A1  B=B1</text><text x="967.5" y="246" class="body" text-anchor="middle">C=B0 then B2</text><text x="967.5" y="268" class="body" text-anchor="middle">candidate0 only</text><rect x="1115" y="150" width="245" height="180" class="decoder"/><text x="1237.5" y="180" class="box-title" text-anchor="middle">vc_mvp_dec_recon</text><text x="1237.5" y="202" class="body" text-anchor="middle">signed 17-bit add</text><text x="1237.5" y="224" class="body" text-anchor="middle">P_SKIP zero rule</text><text x="1237.5" y="246" class="body" text-anchor="middle">final MV and ref_idx</text><rect x="1380" y="150" width="255" height="180" class="decoder"/><text x="1507.5" y="180" class="box-title" text-anchor="middle">vc_mvp_dec_mc_adapter</text><text x="1507.5" y="202" class="body" text-anchor="middle">lane and packet select</text><text x="1507.5" y="224" class="body" text-anchor="middle">rdy stays asserted when ack is low</text><text x="1507.5" y="246" class="body" text-anchor="middle">dec_send</text><rect x="1665" y="150" width="200" height="145" class="external"/><text x="1765.0" y="180" class="box-title" text-anchor="middle">MC / mrg2mc interface</text><text x="1765.0" y="202" class="body" text-anchor="middle">MC acknowledgement</text><text x="1765.0" y="224" class="body" text-anchor="middle">mc2mrg_cand_ack</text><path d="M245,220 L285,220" class="arrow"/><text x="265.0" y="205" class="tiny" text-anchor="middle">accepted</text><path d="M505,220 L545,220" class="arrow"/><text x="525.0" y="205" class="tiny" text-anchor="middle">neib_start</text><path d="M800,220 L840,220" class="arrow"/><text x="820.0" y="205" class="tiny" text-anchor="middle">capture</text><path d="M1095,220 L1115,220" class="arrow"/><text x="1105.0" y="205" class="tiny" text-anchor="middle">MVP</text><path d="M1360,220 L1380,220" class="arrow"/><text x="1370.0" y="205" class="tiny" text-anchor="middle">DEC_SEND</text><path d="M1635,220 L1665,220" class="arrow"/><text x="1650.0" y="205" class="tiny" text-anchor="middle">dec_mrg2mc_cand_rdy/data</text><rect x="585" y="390" width="685" height="110" class="reuse"/><text x="927.5" y="420" class="box-title" text-anchor="middle">vc_mvp_dec_upd_adapter</text><text x="927.5" y="442" class="body" text-anchor="middle">cur_cu_upd = mc_commit</text><text x="927.5" y="464" class="body" text-anchor="middle">committed final MV / ref_idx / coordinates</text><path d="M1665,270 L1635,270" class="feedback"/><text x="1650" y="255" class="tiny" text-anchor="middle">mc2mrg_cand_ack</text><path d="M1505,330 L1505,360 L1270,360 L1270,390" class="feedback"/><text x="1385" y="350" class="small" text-anchor="middle">mc_commit</text><path d="M585,445 L500,445 L500,355 L675,355 L675,330" class="feedback"/><text x="525" y="345" class="tiny" text-anchor="middle">cur_cu_upd / committed MV context</text><rect x="35" y="620" width="1815" height="125" class="reuse"/><text x="942.5" y="650" class="box-title" text-anchor="middle">P8 serial dependency</text><text x="942.5" y="672" class="body" text-anchor="middle">S0 -&gt; commit/update -&gt; S1 -&gt; commit/update -&gt; S2 -&gt; commit/update -&gt; S3 -&gt; commit/update</text><text x="942.5" y="694" class="body" text-anchor="middle">next expected sub-index advances only after the preceding mc_commit</text><rect x="35" y="800" width="1815" height="125" class="flush"/><text x="942.5" y="830" class="box-title" text-anchor="middle">Flush and drain barrier</text><text x="942.5" y="852" class="body" text-anchor="middle">slice or mode cancellation suppresses Candidate, reconstruction, MC, and update activity</text><text x="942.5" y="874" class="body" text-anchor="middle">physical A/B outstanding reads drain before Neighbor ready or qualified completion reopens</text><text x="950" y="970" class="small" text-anchor="middle">Phase 1: P16x16, P8x8, P_SKIP; List0 and ref_idx 0; temporal/Col, scaling, and RefList traversal inactive</text></svg>