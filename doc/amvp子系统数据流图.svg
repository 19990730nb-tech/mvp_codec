<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1450" viewBox="0 0 2800 1450">
  <title>AMVP Top Subsystem Main Data Flow — Clean Layout</title>
  <desc>RTL-derived AMVP data flow arranged as two non-overlapping lanes: candidate production above and FME pairing/result delivery below.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#1f2937"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#2b6cb0"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#c27803"/></marker>
    <style>
      .title{font:700 38px 'DejaVu Sans',sans-serif;fill:#111827}.subtitle{font:15px 'DejaVu Sans',sans-serif;fill:#475569}
      .lane{font:700 15px 'DejaVu Sans',sans-serif;fill:#64748b;letter-spacing:1px}.h1{font:700 19px 'DejaVu Sans',sans-serif;fill:#111827}.h2{font:700 16px 'DejaVu Sans',sans-serif;fill:#111827}
      .txt{font:14px 'DejaVu Sans',sans-serif;fill:#1f2937}.sig{font:13px 'DejaVu Sans Mono',monospace;fill:#111827}.small{font:12px 'DejaVu Sans',sans-serif;fill:#374151}.tiny{font:11px 'DejaVu Sans',sans-serif;fill:#475569}
      .line{fill:none;stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}.blue-line{fill:none;stroke:#2b6cb0;stroke-width:2;marker-end:url(#arrow-blue)}
      .dash{fill:none;stroke:#c27803;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow-orange)}
      .blue{fill:#eef7ff;stroke:#2b6cb0;stroke-width:2}.orange{fill:#fff8e6;stroke:#c27803;stroke-width:2}.purple{fill:#f7f0ff;stroke:#805ad5;stroke-width:2}
      .green{fill:#effcf3;stroke:#2f855a;stroke-width:2}.red{fill:#fff5f5;stroke:#c53030;stroke-width:2}.cyan{fill:#ecfeff;stroke:#27899b;stroke-width:2}.gray{fill:#f7fafc;stroke:#4b5563;stroke-width:2}
      .round{rx:12;ry:12}.sep{stroke:#94a3b8;stroke-width:1;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="2800" height="1450" fill="#fff"/>
  <text x="1400" y="48" text-anchor="middle" class="title">AMVP Top Subsystem Main Data Flow</text>
  <text x="1400" y="76" text-anchor="middle" class="subtitle">Clean two-lane layout · signal directions and arithmetic follow current RTL</text>
  <text x="25" y="124" class="lane">LANE 1 — CANDIDATE PRODUCTION</text>
  <line x1="25" y1="136" x2="2015" y2="136" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane 1: inputs -> control -> neighbor -> candidate -> bank -->
  <rect x="25" y="165" width="270" height="430" class="blue round"/>
  <text x="160" y="197" text-anchor="middle" class="h1">CU / Configuration</text><line x1="25" y1="213" x2="295" y2="213" stroke="#2b6cb0"/>
  <text x="44" y="243" class="sig">cur_cu_start / x / y</text><text x="44" y="267" class="sig">cur_cu_a/b_avail</text><text x="44" y="291" class="sig">cur_cu_is_skip / zmv</text>
  <text x="44" y="315" class="sig">cur_cu_terminate</text><line x1="44" y1="333" x2="275" y2="333" class="sep"/>
  <text x="44" y="361" class="sig">reg_slice_go</text><text x="44" y="385" class="sig">reg_cur_poc</text><text x="44" y="409" class="sig">reg_tmp_mvp_flag</text>
  <text x="44" y="433" class="sig">reg_num_ref_l0_act_m1</text><text x="44" y="457" class="sig">reg_col_ref_idx</text><text x="44" y="481" class="sig">reg_avc_mode</text>
  <text x="44" y="527" class="small">Active AMVP block lanes:</text><text x="44" y="550" class="sig">blk8 / blk16</text><text x="44" y="576" class="small">lane[2] is tied low.</text>

  <rect x="335" y="165" width="290" height="430" class="orange round"/>
  <text x="480" y="197" text-anchor="middle" class="h1">vc_mvp_ctrl</text><text x="480" y="220" text-anchor="middle" class="small">AMVP_OR_MRG = 1</text><line x1="335" y1="236" x2="625" y2="236" stroke="#c27803"/>
  <text x="355" y="269" class="txt">• CU scheduling</text><text x="355" y="297" class="txt">• block/ref traversal</text><text x="355" y="325" class="txt">• neighbor/candidate start</text>
  <line x1="355" y1="345" x2="605" y2="345" class="sep"/><text x="355" y="375" class="sig">cu_cmd_out[2:0]</text><text x="355" y="399" class="sig">cu_blk_en[2:0]</text>
  <text x="355" y="423" class="sig">cur_ref_idx</text><text x="355" y="447" class="sig">neib_cu_start</text><text x="355" y="471" class="sig">cand_cu_start</text><text x="355" y="495" class="sig">cmdq_empty_n</text>
  <text x="355" y="545" class="small">Control outputs use a dedicated</text><text x="355" y="567" class="small">routing channel below lane 1.</text>

  <rect x="665" y="165" width="340" height="430" class="purple round"/>
  <text x="835" y="197" text-anchor="middle" class="h1">vc_mvp_get_neib</text><text x="835" y="220" text-anchor="middle" class="small">shared neighbor reader</text><line x1="665" y1="236" x2="1005" y2="236" stroke="#805ad5"/>
  <text x="685" y="268" class="h2">Memory interfaces</text><text x="696" y="296" class="sig">A/B SRAM · Col C · Ref List</text><text x="696" y="320" class="small">req/addr outward; return data inward</text>
  <line x1="685" y1="340" x2="985" y2="340" class="sep"/><text x="685" y="368" class="h2">Active AMVP path</text>
  <text x="696" y="396" class="sig">start = amvp_cu_start</text><text x="696" y="420" class="sig">cmd = amvp_cmd_out[0]</text><line x1="685" y1="440" x2="985" y2="440" class="sep"/>
  <text x="696" y="468" class="sig">amvp_neib_a / b</text><text x="696" y="492" class="sig">amvp_col_c / avail</text><text x="696" y="516" class="sig">reflist_info</text>
  <text x="696" y="540" class="sig">blk{8,16}_neib_*_r</text><text x="696" y="570" class="small">Named edge taps feed MVBS below.</text>

  <rect x="1045" y="165" width="320" height="430" class="green round"/>
  <text x="1205" y="197" text-anchor="middle" class="h1">vc_mvp_cand_gen</text><text x="1205" y="220" text-anchor="middle" class="small">AMVP candidate generation</text><line x1="1045" y1="236" x2="1365" y2="236" stroke="#2f855a"/>
  <text x="1065" y="269" class="h2">Control inputs</text><text x="1076" y="297" class="sig">cand_cu_start</text><text x="1076" y="321" class="sig">cu_cmd_out_sel</text>
  <line x1="1065" y1="341" x2="1345" y2="341" class="sep"/><text x="1065" y="369" class="h2">Neighbor inputs</text><text x="1076" y="397" class="sig">A / B / Col C / Ref List</text>
  <line x1="1065" y1="417" x2="1345" y2="417" class="sep"/><text x="1065" y="445" class="h2">Outputs</text><text x="1076" y="473" class="sig">cand_mv[0], cand_rdy[0]</text>
  <text x="1076" y="497" class="sig">cand_mv[1], cand_rdy[1]</text><text x="1065" y="543" class="small">candidate = {long, pocdiff,</text><text x="1065" y="565" class="small">ref_idx, MV}</text>

  <rect x="1405" y="165" width="610" height="430" class="blue round"/>
  <text x="1710" y="197" text-anchor="middle" class="h1">AMVP Candidate FIFO Bank</text><text x="1710" y="220" text-anchor="middle" class="small">2 lanes × 4 depth-1 FIFOs · 46 bits each</text>
  <text x="1480" y="254" text-anchor="middle" class="h2">lane</text><text x="1580" y="254" text-anchor="middle" class="h2">r0/c0</text><text x="1700" y="254" text-anchor="middle" class="h2">r0/c1</text><text x="1820" y="254" text-anchor="middle" class="h2">r1/c0</text><text x="1940" y="254" text-anchor="middle" class="h2">r1/c1</text>
  <rect x="1435" y="274" width="90" height="96" class="gray round"/><text x="1480" y="328" text-anchor="middle" class="h2">blk8</text>
  <rect x="1540" y="274" width="80" height="96" class="blue round"/><rect x="1660" y="274" width="80" height="96" class="blue round"/><rect x="1780" y="274" width="80" height="96" class="blue round"/><rect x="1900" y="274" width="80" height="96" class="blue round"/>
  <text x="1580" y="317" text-anchor="middle" class="small">FIFO</text><text x="1580" y="342" text-anchor="middle" class="tiny">r0 c0</text><text x="1700" y="317" text-anchor="middle" class="small">FIFO</text><text x="1700" y="342" text-anchor="middle" class="tiny">r0 c1</text><text x="1820" y="317" text-anchor="middle" class="small">FIFO</text><text x="1820" y="342" text-anchor="middle" class="tiny">r1 c0</text><text x="1940" y="317" text-anchor="middle" class="small">FIFO</text><text x="1940" y="342" text-anchor="middle" class="tiny">r1 c1</text>
  <rect x="1435" y="392" width="90" height="96" class="gray round"/><text x="1480" y="446" text-anchor="middle" class="h2">blk16</text>
  <rect x="1540" y="392" width="80" height="96" class="blue round"/><rect x="1660" y="392" width="80" height="96" class="blue round"/><rect x="1780" y="392" width="80" height="96" class="blue round"/><rect x="1900" y="392" width="80" height="96" class="blue round"/>
  <text x="1580" y="435" text-anchor="middle" class="small">FIFO</text><text x="1580" y="460" text-anchor="middle" class="tiny">r0 c0</text><text x="1700" y="435" text-anchor="middle" class="small">FIFO</text><text x="1700" y="460" text-anchor="middle" class="tiny">r0 c1</text><text x="1820" y="435" text-anchor="middle" class="small">FIFO</text><text x="1820" y="460" text-anchor="middle" class="tiny">r1 c0</text><text x="1940" y="435" text-anchor="middle" class="small">FIFO</text><text x="1940" y="460" text-anchor="middle" class="tiny">r1 c1</text>
  <text x="1710" y="535" text-anchor="middle" class="sig">{blk_sz, long, pocdiff, ref_idx, MV}</text><text x="1710" y="562" text-anchor="middle" class="small">selected reference pair is popped with the FME MV</text>

  <!-- Clean lane-1 connectors -->
  <path d="M295 365 H335" class="line"/><path d="M625 365 H665" class="line"/><path d="M1005 365 H1045" class="line"/><path d="M1365 365 H1405" class="line"/>
  <text x="315" y="351" text-anchor="middle" class="tiny">CU</text><text x="645" y="351" text-anchor="middle" class="tiny">start/cmd</text><text x="1025" y="351" text-anchor="middle" class="tiny">neighbor data</text><text x="1385" y="351" text-anchor="middle" class="tiny">candidates</text>
  <path d="M520 595 V630 H1205 V595" class="dash"/><text x="852" y="620" text-anchor="middle" class="tiny">cand_cu_start + cu_cmd_out_sel</text>

  <text x="335" y="688" class="lane">LANE 2 — FME PAIRING, MVD SELECTION AND RESULT DELIVERY</text>
  <line x1="335" y1="700" x2="2640" y2="700" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane 2 -->
  <rect x="335" y="735" width="265" height="280" class="gray round"/>
  <text x="467" y="767" text-anchor="middle" class="h1">FME (external)</text><line x1="335" y1="783" x2="600" y2="783" stroke="#4b5563"/>
  <text x="354" y="817" class="sig">fme2amvp_cand_rdy</text><text x="354" y="841" class="sig">fme2amvp_cand_mv</text><text x="354" y="879" class="sig">amvp2fme_cand_ack</text>
  <text x="354" y="925" class="small">current/FME MV</text><text x="354" y="947" class="small">+ reference index</text>

  <rect x="640" y="735" width="300" height="280" class="blue round"/>
  <text x="790" y="767" text-anchor="middle" class="h1">FME-return MV FIFOs</text><line x1="640" y1="783" x2="940" y2="783" stroke="#2b6cb0"/>
  <rect x="666" y="815" width="112" height="125" class="blue round"/><rect x="802" y="815" width="112" height="125" class="blue round"/>
  <text x="722" y="851" text-anchor="middle" class="h2">blk8</text><text x="722" y="878" text-anchor="middle" class="small">depth 8</text><text x="722" y="907" text-anchor="middle" class="tiny">{ref,MV}</text>
  <text x="858" y="851" text-anchor="middle" class="h2">blk16</text><text x="858" y="878" text-anchor="middle" class="small">depth 2</text><text x="858" y="907" text-anchor="middle" class="tiny">{ref,MV}</text>
  <text x="790" y="978" text-anchor="middle" class="small">blk8 pop priority</text>

  <rect x="980" y="735" width="340" height="280" class="orange round"/>
  <text x="1150" y="767" text-anchor="middle" class="h1">Reference Pairing / Pop</text><line x1="980" y1="783" x2="1320" y2="783" stroke="#c27803"/>
  <text x="1001" y="817" class="txt">• require candidate FIFO ready</text><text x="1001" y="845" class="txt">• select pair by fme_ref_idx</text><text x="1001" y="873" class="txt">• ZMV forces current MV to zero</text>
  <line x1="1001" y1="895" x2="1299" y2="895" class="sep"/><text x="1001" y="925" class="sig">sel_cand_0 / sel_cand_1</text><text x="1001" y="949" class="sig">mvx / mvy / fme_ref_idx</text>

  <rect x="1360" y="735" width="360" height="280" class="red round"/>
  <text x="1540" y="767" text-anchor="middle" class="h1">MVD Cost / Candidate Select</text><line x1="1360" y1="783" x2="1720" y2="783" stroke="#c53030"/>
  <text x="1381" y="817" class="sig">mvd0 = FME_mv - cand0_MVP</text><text x="1381" y="843" class="sig">mvd1 = FME_mv - cand1_MVP</text>
  <text x="1381" y="879" class="txt">Exp-Golomb bit cost: x + y</text><text x="1381" y="911" class="sig">cand_sel = !AVC &amp;&amp; cost1&lt;cost0</text>
  <text x="1381" y="949" class="small">AVC always selects candidate 0.</text><text x="1381" y="977" class="sig">selected MVD + MVP metadata</text>

  <rect x="2080" y="735" width="370" height="280" class="purple round"/>
  <text x="2265" y="767" text-anchor="middle" class="h1">AMVP Result Pack / FIFO</text><text x="2265" y="790" text-anchor="middle" class="small">2 × depth-2 AMVP2CCU FIFO</text><line x1="2080" y1="806" x2="2450" y2="806" stroke="#805ad5"/>
  <text x="2102" y="839" class="sig">MV / MVD / ref_idx / cand_sel</text><text x="2102" y="865" class="sig">long / pocdiff / mv_bs_a,b</text><line x1="2102" y1="885" x2="2428" y2="885" class="sep"/>
  <text x="2102" y="915" class="sig">out: irpu_amvp_rdy / rd</text><text x="2102" y="941" class="sig">in:  irpu_amvp_ack</text><text x="2102" y="977" class="small">pop = rdy &amp; ack</text>
  <rect x="2500" y="800" width="115" height="130" class="gray round"/><text x="2557" y="855" text-anchor="middle" class="h1">CCU</text><text x="2557" y="883" text-anchor="middle" class="small">consumer</text>

  <!-- Clean lane-2 connectors -->
  <path d="M600 835 H640" class="line"/><path d="M640 900 H620 V885 H600" class="line"/><text x="620" y="822" text-anchor="middle" class="tiny">rdy/MV</text><text x="620" y="925" text-anchor="middle" class="tiny">ack</text>
  <path d="M940 875 H980" class="line"/><path d="M1320 875 H1360" class="line"/><path d="M1720 875 H2080" class="line"/>
  <text x="960" y="861" text-anchor="middle" class="tiny">FME MV</text><text x="1340" y="861" text-anchor="middle" class="tiny">paired candidates</text><text x="1900" y="861" text-anchor="middle" class="tiny">selected result</text>
  <path d="M2450 835 H2500" class="blue-line"/><path d="M2500 905 H2450" class="line"/><text x="2475" y="822" text-anchor="middle" class="tiny">rdy/rd</text><text x="2475" y="929" text-anchor="middle" class="tiny">ack</text>

  <!-- Candidate bank feeds pairing through a clear vertical channel -->
  <path d="M1710 595 V665 H1150 V735" class="line"/><text x="1415" y="654" text-anchor="middle" class="tiny">candidate FIFO pair selected by ref_idx</text>

  <!-- Secondary branches kept below the main lane -->
  <rect x="1360" y="1080" width="360" height="175" class="orange round" stroke-dasharray="8 5"/>
  <text x="1540" y="1112" text-anchor="middle" class="h1">AVC export to ve_mrg_top</text><text x="1381" y="1148" class="sig">avc_mvp_push / avc_ref_idx</text><text x="1381" y="1172" class="sig">avc_is_long / avc_pocdiff</text><text x="1381" y="1196" class="sig">avc_mvpxy / avc_mvd_gt4</text>
  <text x="1381" y="1230" class="small">outputs → MRG blk16 FIFO[2]/FIFO[3]</text><path d="M1540 1015 V1080" class="dash"/>

  <rect x="980" y="1080" width="340" height="175" class="cyan round"/>
  <text x="1150" y="1112" text-anchor="middle" class="h1">MVBS (parallel)</text><text x="1001" y="1148" class="small">current/FME MV vs named A/B edge</text><text x="1001" y="1170" class="small">taps exported by vc_mvp_get_neib</text>
  <text x="1001" y="1202" class="sig">abs(dx)&gt;=4 || abs(dy)&gt;=4</text><text x="1001" y="1230" class="sig">output net: mv_bs_a / mv_bs_b</text>
  <path d="M1150 1015 V1080" class="line"/>

  <rect x="2080" y="1080" width="370" height="175" class="gray round"/>
  <text x="2265" y="1112" text-anchor="middle" class="h1">Termination FSM</text><text x="2102" y="1150" class="sig">IDLE → WAIT_EMPTY → FLUSH</text><text x="2102" y="1184" class="small">wait for all queues, then push</text><text x="2102" y="1207" class="small">pending block-size termination results</text>
  <path d="M2265 1080 V1015" class="line"/>

  <!-- Bottom note -->
  <rect x="25" y="1310" width="2590" height="82" class="orange round" stroke-dasharray="8 5"/>
  <text x="48" y="1342" class="h2">Directional check</text><text x="48" y="1370" class="sig">irpu_amvp_rdy / irpu_amvp_rd → CCU; irpu_amvp_ack → AMVP. MVD = FME_mv - candidate_MVP. avc_* signals leave AMVP for MRG.</text>
  <rect x="25" y="1407" width="690" height="30" class="gray round" stroke-dasharray="5 4"/><rect x="42" y="1415" width="18" height="12" class="orange"/><text x="68" y="1426" class="tiny">control</text>
  <rect x="140" y="1415" width="18" height="12" class="purple"/><text x="166" y="1426" class="tiny">neighbor/output</text><rect x="300" y="1415" width="18" height="12" class="green"/><text x="326" y="1426" class="tiny">candidate</text>
  <rect x="440" y="1415" width="18" height="12" class="cyan"/><text x="466" y="1426" class="tiny">parallel metadata</text><text x="2775" y="1428" text-anchor="end" class="small">RTL basis: ve_amvp_top.v · vc_mvp_ctrl.v · vc_mvp_cand_gen.v · vc_mvp_get_neib.v</text>
</svg>
