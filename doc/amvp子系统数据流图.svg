<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1400" viewBox="0 0 2500 1400">
  <title>AMVP Top Subsystem Main Data Flow — Corrected</title>
  <desc>RTL-derived AMVP data flow with corrected CCU output directions, MVD subtraction order, and AVC export toward MRG.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#1f2937"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#2b6cb0"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#c27803"/></marker>
    <style>
      .title{font:700 38px 'DejaVu Sans',sans-serif;fill:#111827}.subtitle{font:15px 'DejaVu Sans',sans-serif;fill:#475569}
      .h1{font:700 19px 'DejaVu Sans',sans-serif;fill:#111827}.h2{font:700 16px 'DejaVu Sans',sans-serif;fill:#111827}
      .txt{font:14px 'DejaVu Sans',sans-serif;fill:#1f2937}.sig{font:13px 'DejaVu Sans Mono',monospace;fill:#111827}
      .small{font:12px 'DejaVu Sans',sans-serif;fill:#374151}.tiny{font:11px 'DejaVu Sans',sans-serif;fill:#475569}
      .line{fill:none;stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}.blue-line{fill:none;stroke:#2b6cb0;stroke-width:2;marker-end:url(#arrow-blue)}
      .dash{fill:none;stroke:#c27803;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow-orange)}
      .blue{fill:#eef7ff;stroke:#2b6cb0;stroke-width:2}.orange{fill:#fff8e6;stroke:#c27803;stroke-width:2}
      .purple{fill:#f7f0ff;stroke:#805ad5;stroke-width:2}.green{fill:#effcf3;stroke:#2f855a;stroke-width:2}
      .red{fill:#fff5f5;stroke:#c53030;stroke-width:2}.cyan{fill:#ecfeff;stroke:#27899b;stroke-width:2}
      .gray{fill:#f7fafc;stroke:#4b5563;stroke-width:2}.round{rx:12;ry:12}.sep{stroke:#94a3b8;stroke-width:1;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="2500" height="1400" fill="#fff"/>
  <text x="1250" y="48" text-anchor="middle" class="title">AMVP Top Subsystem Main Data Flow</text>
  <text x="1250" y="76" text-anchor="middle" class="subtitle">Corrected from ve_amvp_top / vc_mvp_ctrl / vc_mvp_cand_gen / vc_mvp_get_neib RTL</text>

  <!-- CU/config and controller -->
  <rect x="25" y="170" width="285" height="405" class="blue round"/>
  <text x="167" y="202" text-anchor="middle" class="h1">CU / Configuration</text><line x1="25" y1="218" x2="310" y2="218" stroke="#2b6cb0"/>
  <text x="44" y="248" class="sig">cur_cu_start / x / y</text><text x="44" y="272" class="sig">cur_cu_a/b_avail</text>
  <text x="44" y="296" class="sig">cur_cu_is_skip / zmv</text><text x="44" y="320" class="sig">cur_cu_terminate</text>
  <line x1="44" y1="338" x2="290" y2="338" class="sep"/><text x="44" y="366" class="sig">reg_slice_go / reg_cur_poc</text>
  <text x="44" y="390" class="sig">reg_tmp_mvp_flag</text><text x="44" y="414" class="sig">reg_num_ref_l0_act_m1</text>
  <text x="44" y="438" class="sig">reg_col_ref_idx</text><text x="44" y="462" class="sig">reg_avc_mode</text>
  <text x="44" y="500" class="small">AMVP supports blk8 / blk16 lanes.</text><text x="44" y="521" class="small">MAX_BLK_SZ=2; lane[2] is tied low.</text>

  <rect x="350" y="170" width="320" height="405" class="orange round"/>
  <text x="510" y="202" text-anchor="middle" class="h1">vc_mvp_ctrl</text><text x="510" y="225" text-anchor="middle" class="small">AMVP_OR_MRG = 1</text>
  <line x1="350" y1="241" x2="670" y2="241" stroke="#c27803"/>
  <text x="370" y="274" class="txt">• CU command scheduling</text><text x="370" y="302" class="txt">• block-size / reference traversal</text>
  <text x="370" y="330" class="txt">• neighbor and candidate starts</text><line x1="370" y1="350" x2="650" y2="350" class="sep"/>
  <text x="370" y="380" class="sig">cu_cmd_out[2:0]</text><text x="370" y="404" class="sig">cu_blk_en[2:0]</text>
  <text x="370" y="428" class="sig">cur_ref_idx</text><text x="370" y="452" class="sig">neib_cu_start</text>
  <text x="370" y="476" class="sig">cand_cu_start</text><text x="370" y="500" class="sig">cmdq_empty_n</text>
  <path d="M310 365 H350" class="line"/>

  <!-- Shared memories and neighbor reader -->
  <rect x="720" y="115" width="118" height="62" class="gray round"/><rect x="854" y="115" width="118" height="62" class="gray round"/><rect x="988" y="115" width="118" height="62" class="gray round"/>
  <text x="779" y="140" text-anchor="middle" class="h2">A/B SRAM</text><text x="779" y="160" text-anchor="middle" class="tiny">spatial MV</text>
  <text x="913" y="140" text-anchor="middle" class="h2">Col C</text><text x="913" y="160" text-anchor="middle" class="tiny">temporal MV</text>
  <text x="1047" y="140" text-anchor="middle" class="h2">Ref List</text><text x="1047" y="160" text-anchor="middle" class="tiny">POC metadata</text>
  <rect x="720" y="210" width="386" height="365" class="purple round"/>
  <text x="913" y="242" text-anchor="middle" class="h1">vc_mvp_get_neib</text><text x="913" y="265" text-anchor="middle" class="small">shared AMVP / MRG neighbor reader</text>
  <line x1="720" y1="281" x2="1106" y2="281" stroke="#805ad5"/>
  <text x="741" y="315" class="txt">• active start: amvp_cu_start</text><text x="741" y="343" class="txt">• active command: amvp_cmd_out[0]</text>
  <text x="741" y="371" class="txt">• fetches A/B, Col C and reference list</text><line x1="741" y1="391" x2="1085" y2="391" class="sep"/>
  <text x="741" y="421" class="sig">amvp_neib_a / amvp_neib_b</text><text x="741" y="445" class="sig">amvp_col_c / *_avail</text>
  <text x="741" y="469" class="sig">reflist_info</text><text x="741" y="493" class="sig">blk{8,16}_neib_{a,b}_r</text>
  <text x="741" y="517" class="sig">neib_done_amvp</text>
  <path d="M670 365 H720" class="line"/>
  <path d="M770 210 V177" class="line"/><path d="M788 177 V210" class="line"/>
  <path d="M904 210 V177" class="line"/><path d="M922 177 V210" class="line"/>
  <path d="M1038 210 V177" class="line"/><path d="M1056 177 V210" class="line"/>
  <text x="738" y="194" class="tiny">req</text><text x="793" y="194" class="tiny">return</text>

  <!-- Candidate generation -->
  <rect x="1150" y="210" width="345" height="365" class="green round"/>
  <text x="1322" y="242" text-anchor="middle" class="h1">vc_mvp_cand_gen</text><text x="1322" y="265" text-anchor="middle" class="small">AMVP candidate generation</text>
  <line x1="1150" y1="281" x2="1495" y2="281" stroke="#2f855a"/>
  <text x="1171" y="314" class="h2">Inputs</text><text x="1182" y="342" class="sig">cand_cu_start / cu_cmd_out</text>
  <text x="1182" y="366" class="sig">neighbor / Col C / ref list</text><text x="1182" y="390" class="sig">cur_ref_idx</text>
  <line x1="1171" y1="410" x2="1474" y2="410" class="sep"/><text x="1171" y="439" class="h2">Outputs</text>
  <text x="1182" y="467" class="sig">cand_mv[0], cand_rdy[0]</text><text x="1182" y="491" class="sig">cand_mv[1], cand_rdy[1]</text>
  <text x="1171" y="528" class="small">candidate = {long, pocdiff, ref_idx, MV}</text>
  <path d="M1106 390 H1150" class="line"/><path d="M670 480 V610 H1125 V360 H1150" class="line"/>

  <!-- AMVP candidate FIFO bank -->
  <rect x="1540" y="130" width="535" height="445" class="blue round"/>
  <text x="1807" y="162" text-anchor="middle" class="h1">AMVP Candidate FIFO Bank</text><text x="1807" y="185" text-anchor="middle" class="small">2 block-size lanes × 4 depth-1 FIFOs, 46 bits each</text>
  <text x="1618" y="218" text-anchor="middle" class="h2">lane</text><text x="1708" y="218" text-anchor="middle" class="h2">ref0/c0</text><text x="1810" y="218" text-anchor="middle" class="h2">ref0/c1</text><text x="1912" y="218" text-anchor="middle" class="h2">ref1/c0</text><text x="2014" y="218" text-anchor="middle" class="h2">ref1/c1</text>
  <rect x="1570" y="238" width="95" height="95" class="gray round"/><text x="1618" y="290" text-anchor="middle" class="h2">blk8</text>
  <rect x="1677" y="238" width="82" height="95" class="blue round"/><rect x="1779" y="238" width="82" height="95" class="blue round"/><rect x="1881" y="238" width="82" height="95" class="blue round"/><rect x="1983" y="238" width="62" height="95" class="blue round"/>
  <text x="1718" y="278" text-anchor="middle" class="small">FIFO</text><text x="1718" y="300" text-anchor="middle" class="tiny">r0 c0</text><text x="1820" y="278" text-anchor="middle" class="small">FIFO</text><text x="1820" y="300" text-anchor="middle" class="tiny">r0 c1</text><text x="1922" y="278" text-anchor="middle" class="small">FIFO</text><text x="1922" y="300" text-anchor="middle" class="tiny">r1 c0</text><text x="2014" y="278" text-anchor="middle" class="small">FIFO</text><text x="2014" y="300" text-anchor="middle" class="tiny">r1 c1</text>
  <rect x="1570" y="355" width="95" height="95" class="gray round"/><text x="1618" y="407" text-anchor="middle" class="h2">blk16</text>
  <rect x="1677" y="355" width="82" height="95" class="blue round"/><rect x="1779" y="355" width="82" height="95" class="blue round"/><rect x="1881" y="355" width="82" height="95" class="blue round"/><rect x="1983" y="355" width="62" height="95" class="blue round"/>
  <text x="1718" y="395" text-anchor="middle" class="small">FIFO</text><text x="1718" y="417" text-anchor="middle" class="tiny">r0 c0</text><text x="1820" y="395" text-anchor="middle" class="small">FIFO</text><text x="1820" y="417" text-anchor="middle" class="tiny">r0 c1</text><text x="1922" y="395" text-anchor="middle" class="small">FIFO</text><text x="1922" y="417" text-anchor="middle" class="tiny">r1 c0</text><text x="2014" y="395" text-anchor="middle" class="small">FIFO</text><text x="2014" y="417" text-anchor="middle" class="tiny">r1 c1</text>
  <text x="1807" y="490" text-anchor="middle" class="sig">{blk_sz, long, pocdiff, ref_idx, MV}</text><text x="1807" y="520" text-anchor="middle" class="small">selected reference pair is popped with the matching FME MV</text>
  <path d="M1495 390 H1540" class="line"/>

  <!-- FME interface and FIFOs -->
  <rect x="25" y="710" width="285" height="230" class="gray round"/>
  <text x="167" y="742" text-anchor="middle" class="h1">FME (external)</text><line x1="25" y1="758" x2="310" y2="758" stroke="#4b5563"/>
  <text x="44" y="792" class="sig">fme2amvp_cand_rdy[1:0]</text><text x="44" y="816" class="sig">fme2amvp_cand_mv</text>
  <text x="44" y="852" class="sig">amvp2fme_cand_ack[1:0]</text><text x="44" y="892" class="small">Returned current/FME motion vector</text><text x="44" y="913" class="small">is matched by block lane and ref_idx.</text>
  <rect x="350" y="690" width="320" height="270" class="blue round"/>
  <text x="510" y="722" text-anchor="middle" class="h1">FME-return MV FIFOs</text><line x1="350" y1="738" x2="670" y2="738" stroke="#2b6cb0"/>
  <rect x="378" y="770" width="120" height="125" class="blue round"/><rect x="520" y="770" width="120" height="125" class="blue round"/>
  <text x="438" y="806" text-anchor="middle" class="h2">blk8 FIFO</text><text x="438" y="833" text-anchor="middle" class="small">depth 8</text><text x="438" y="862" text-anchor="middle" class="tiny">{ref_idx, MV}</text>
  <text x="580" y="806" text-anchor="middle" class="h2">blk16 FIFO</text><text x="580" y="833" text-anchor="middle" class="small">depth 2</text><text x="580" y="862" text-anchor="middle" class="tiny">{ref_idx, MV}</text>
  <text x="510" y="930" text-anchor="middle" class="small">blk8 has pop priority over blk16</text>
  <path d="M310 800 H350" class="line"/><path d="M350 865 H328 V850 H310" class="line"/>
  <text x="329" y="786" text-anchor="middle" class="tiny">rdy / MV</text><text x="329" y="839" text-anchor="middle" class="tiny">ack</text>

  <!-- Pairing and exact MVD/cost -->
  <rect x="720" y="690" width="386" height="270" class="orange round"/>
  <text x="913" y="722" text-anchor="middle" class="h1">Reference Pairing / Pop</text><line x1="720" y1="738" x2="1106" y2="738" stroke="#c27803"/>
  <text x="741" y="772" class="txt">• pop FME MV only when candidate FIFO ready</text><text x="741" y="800" class="txt">• fme_ref_idx selects candidate 0 / 1 pair</text>
  <text x="741" y="828" class="txt">• ZMV forces current mvx/mvy to zero</text><line x1="741" y1="848" x2="1085" y2="848" class="sep"/>
  <text x="741" y="878" class="sig">sel_cand_0 / sel_cand_1</text><text x="741" y="902" class="sig">mvx / mvy / fme_ref_idx</text>
  <path d="M670 825 H720" class="line"/><path d="M1807 575 V650 H913 V690" class="line"/>

  <rect x="1150" y="690" width="400" height="270" class="red round"/>
  <text x="1350" y="722" text-anchor="middle" class="h1">MVD + Candidate Cost / Select</text><line x1="1150" y1="738" x2="1550" y2="738" stroke="#c53030"/>
  <text x="1172" y="774" class="sig">mvd0 = FME_mv - cand0_MVP</text><text x="1172" y="800" class="sig">mvd1 = FME_mv - cand1_MVP</text>
  <text x="1172" y="832" class="txt">Exp-Golomb bit cost: costx + costy</text><text x="1172" y="860" class="sig">cand_sel = !reg_avc_mode &amp;&amp; (cost1 &lt; cost0)</text>
  <text x="1172" y="900" class="small">AVC mode always selects candidate 0.</text><text x="1172" y="925" class="sig">selected MVD + MVP metadata</text>
  <path d="M1106 825 H1150" class="line"/>

  <!-- MVBS -->
  <rect x="1595" y="690" width="330" height="270" class="cyan round"/>
  <text x="1760" y="722" text-anchor="middle" class="h1">MVBS (parallel)</text><line x1="1595" y1="738" x2="1925" y2="738" stroke="#27899b"/>
  <text x="1617" y="774" class="txt">Compare current/FME MV with</text><text x="1617" y="800" class="txt">available A/B neighbor MVs.</text>
  <text x="1617" y="836" class="sig">abs(dx) &gt;= 4 || abs(dy) &gt;= 4</text><text x="1617" y="872" class="sig">mv_bs_a[7:0]</text><text x="1617" y="896" class="sig">mv_bs_b[7:0]</text>
  <text x="1617" y="930" class="small">Calculated beside MVD/cost selection.</text>
  <path d="M1106 520 H1125 V655 H1760 V690" class="line"/><path d="M1106 900 H1595" class="line"/>

  <!-- Result FIFO and explicit directions -->
  <rect x="1970" y="650" width="345" height="350" class="purple round"/>
  <text x="2142" y="682" text-anchor="middle" class="h1">AMVP Result Pack / FIFO</text><text x="2142" y="705" text-anchor="middle" class="small">2 × depth-2 AMVP2CCU FIFO</text><line x1="1970" y1="721" x2="2315" y2="721" stroke="#805ad5"/>
  <text x="1992" y="755" class="small">Packed fields:</text><text x="2002" y="783" class="sig">MV(x,y) / MVD(x,y)</text><text x="2002" y="807" class="sig">ref_idx / cand_sel</text>
  <text x="2002" y="831" class="sig">long / pocdiff / mv_bs_a,b</text><line x1="1992" y1="851" x2="2293" y2="851" class="sep"/>
  <text x="1992" y="883" class="h2">To CCU</text><text x="2002" y="912" class="sig">irpu_amvp_rdy[1:0]</text><text x="2002" y="936" class="sig">irpu_amvp_rd[1:0]</text>
  <text x="1992" y="973" class="small">pop = rdy &amp; ack</text>
  <path d="M1550 825 H1970" class="line"/><path d="M1925 900 H1970" class="line"/>

  <rect x="2360" y="770" width="115" height="120" class="gray round"/><text x="2417" y="823" text-anchor="middle" class="h1">CCU</text><text x="2417" y="850" text-anchor="middle" class="small">consumer</text>
  <path d="M2315 805 H2360" class="blue-line"/><text x="2337" y="793" text-anchor="middle" class="tiny">rdy / rd</text>
  <path d="M2360 870 H2315" class="line"/><text x="2337" y="894" text-anchor="middle" class="tiny">ack</text>

  <!-- Termination and AVC export -->
  <rect x="350" y="1050" width="320" height="190" class="gray round"/>
  <text x="510" y="1082" text-anchor="middle" class="h1">Termination FSM</text><text x="370" y="1120" class="sig">IDLE → WAIT_EMPTY → FLUSH</text>
  <text x="370" y="1153" class="small">wait for command/candidate/result queues</text><text x="370" y="1178" class="small">then issue pending block-size pushes</text>
  <path d="M670 1145 H1940 V960 H1970" class="line"/>

  <rect x="760" y="1050" width="1165" height="190" class="orange round" stroke-dasharray="8 5"/>
  <text x="790" y="1084" class="h1">AVC export to MRG blk16 path</text><text x="790" y="1118" class="sig">avc_mvp_push | avc_ref_idx | avc_is_long | avc_pocdiff | avc_mvpxy | avc_mvd_gt4</text>
  <text x="790" y="1152" class="small">These are outputs of ve_amvp_top. They feed the AVC-mode blk16 injection in ve_mrg_top;</text>
  <text x="790" y="1175" class="small">they are not an incoming bypass into the AMVP result FIFO.</text>
  <path d="M1350 960 V1050" class="dash"/>
  <rect x="2070" y="1080" width="300" height="105" class="green round"/><text x="2220" y="1113" text-anchor="middle" class="h2">ve_mrg_top AVC injection</text><text x="2220" y="1141" text-anchor="middle" class="sig">blk16 FIFO[2] + FIFO[3]</text><text x="2220" y="1166" text-anchor="middle" class="small">downstream consumer</text>
  <path d="M1925 1132 H2070" class="dash"/>

  <!-- Qualification and legend -->
  <rect x="25" y="1280" width="2450" height="72" class="orange round" stroke-dasharray="8 5"/>
  <text x="48" y="1310" class="h2">Directional check</text><text x="48" y="1336" class="sig">irpu_amvp_rdy / irpu_amvp_rd are outputs toward CCU; irpu_amvp_ack is the return input. MVD order follows fme_mv - predictor.</text>
  <rect x="25" y="1364" width="780" height="28" class="gray round" stroke-dasharray="5 4"/>
  <rect x="40" y="1371" width="18" height="12" class="orange"/><text x="66" y="1382" class="tiny">control</text><rect x="138" y="1371" width="18" height="12" class="purple"/><text x="164" y="1382" class="tiny">neighbor/output</text>
  <rect x="286" y="1371" width="18" height="12" class="green"/><text x="312" y="1382" class="tiny">candidate</text><rect x="422" y="1371" width="18" height="12" class="cyan"/><text x="448" y="1382" class="tiny">parallel metadata</text>
  <rect x="604" y="1371" width="18" height="12" class="gray"/><text x="630" y="1382" class="tiny">external</text>
  <text x="2475" y="1384" text-anchor="end" class="small">RTL basis: ve_amvp_top.v · vc_mvp_ctrl.v · vc_mvp_cand_gen.v · vc_mvp_get_neib.v</text>
</svg>
